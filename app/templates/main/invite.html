{% extends "base.html" %}

{% block content %}
<div class="invite-container">
    <div class="invite-card">
        <div class="invite-header">
            <span class="invite-tag">EXCLUSIVE INVITATION</span>
            <h1 class="invite-title">Likitha's 19th Birthday</h1>
            <p class="invite-subtitle">A Digital Journey of Brilliance & Grace</p>
        </div>

        <div class="invite-body">
            <div class="qr-section">
                <img src="{{ url_for('static', filename='image/qr_code.png') }}" alt="QR Code" class="qr-code">
                <p class="qr-text">Scan to experience the tribute</p>
            </div>
            
            <div class="invite-details">
                <div class="detail-item">
                    <span class="detail-label">EVENT</span>
                    <span class="detail-value">Digital Tribute Premiere</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">EDITION</span>
                    <span class="detail-value">19th Birthday • 2026</span>
                </div>
            </div>
        </div>

        <div class="invite-footer">
            <a href="{{ url_for('auth.login') }}" class="btn-primary">ENTER EXPERIENCE</a>
            <p class="invite-url">birthday-likitha-2026.onrender.com</p>
        </div>
    </div>
</div>

<style>
    .invite-container {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        padding: 20px;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        position: relative;
    }

    /* Animated background glow */
    .invite-container::before {
        content: '';
        position: absolute;
        width: 150%;
        height: 150%;
        background: radial-gradient(circle at 30% 30%, rgba(39, 196, 149, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 70% 70%, rgba(232, 18, 175, 0.1) 0%, transparent 50%);
        animation: rotateGlow 20s linear infinite;
    }

    @keyframes rotateGlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .invite-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 40px;
        padding: 60px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 1;
        box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
        animation: fadeInScale 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.9) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .invite-tag {
        font-size: 0.7rem;
        letter-spacing: 0.4em;
        color: #27c495;
        font-weight: 600;
        display: block;
        margin-bottom: 15px;
    }

    .invite-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.8rem;
        color: #fff;
        margin: 0 0 10px 0;
        font-weight: 700;
        line-height: 1.2;
    }

    .invite-subtitle {
        color: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
        margin-bottom: 40px;
        font-weight: 300;
    }

    .qr-section {
        background: rgba(255, 255, 255, 0.05);
        padding: 30px;
        border-radius: 30px;
        margin-bottom: 40px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: transform 0.4s ease;
    }

    .qr-section:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.08);
    }

    .qr-code {
        width: 180px;
        height: 180px;
        border-radius: 15px;
        margin-bottom: 15px;
        filter: brightness(1.1) contrast(1.1);
    }

    .qr-text {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0;
    }

    .invite-details {
        display: flex;
        justify-content: space-around;
        margin-bottom: 50px;
        text-align: left;
    }

    .detail-item {
        display: flex;
        flex-direction: column;
    }

    .detail-label {
        font-size: 0.6rem;
        color: rgba(255, 255, 255, 0.3);
        letter-spacing: 0.2em;
        margin-bottom: 5px;
    }

    .detail-value {
        font-size: 0.85rem;
        color: #fff;
        font-weight: 500;
    }

    .btn-primary {
        background: #fff;
        color: #000;
        text-decoration: none;
        padding: 18px 40px;
        border-radius: 100px;
        font-weight: 600;
        letter-spacing: 0.1em;
        display: inline-block;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        margin-bottom: 25px;
        width: 100%;
        box-sizing: border-box;
    }

    .btn-primary:hover {
        transform: scale(1.05);
        background: #27c495;
        color: #fff;
        box-shadow: 0 20px 40px rgba(39, 196, 149, 0.3);
    }

    .invite-url {
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.75rem;
        margin: 0;
        font-weight: 300;
    }

    @media (max-width: 480px) {
        .invite-card {
            padding: 40px 30px;
        }
        .invite-title {
            font-size: 2rem;
        }
    }
</style>
{% endblock %}
